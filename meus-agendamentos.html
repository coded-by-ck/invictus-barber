<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Consulte, acompanhe ou cancele seus horários agendados na Invictus Barber Studio." />
    <title>Invictus Barber | Meus Agendamentos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --panel: rgba(18, 18, 18, 0.78);
        --panel-strong: rgba(25, 23, 19, 0.94);
        --gold: #d7b46a;
        --gold-soft: rgba(215, 180, 106, 0.2);
        --text: #f7f1e8;
        --muted: #aaa39a;
        --line: rgba(215, 180, 106, 0.2);
        --danger: #ff7a7a;
        --success: #8ee0a1;
        --neutral: #b7b2a8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        background:
          radial-gradient(circle at 22% 18%, rgba(215, 180, 106, 0.14), transparent 34%),
          linear-gradient(145deg, #030303 0%, #12110f 54%, #050505 100%);
        color: var(--text);
        font-family: Inter, system-ui, sans-serif;
      }

      .bookings-shell {
        width: min(920px, 100%);
        margin: 0 auto;
        padding: 32px 0;
      }

      .panel {
        border: 1px solid var(--line);
        background: linear-gradient(160deg, var(--panel), var(--panel-strong));
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.48);
        backdrop-filter: blur(18px);
        padding: 30px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        width: fit-content;
        color: inherit;
        text-decoration: none;
        margin-bottom: 30px;
      }

      .brand__mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        color: var(--gold);
        font-family: Oswald, sans-serif;
        font-size: 22px;
        font-weight: 700;
      }

      .brand strong,
      h1 {
        font-family: Oswald, sans-serif;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .brand strong {
        display: block;
        font-size: 22px;
      }

      .brand small,
      p,
      .booking-card small,
      label {
        color: var(--muted);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(36px, 8vw, 64px);
        line-height: 0.96;
      }

      form {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        margin: 28px 0;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.28);
        color: var(--text);
        padding: 15px 16px;
        font: inherit;
        outline: none;
      }

      input:focus {
        border-color: var(--gold);
        box-shadow: 0 0 0 4px var(--gold-soft);
      }

      button,
      .cancel-link,
      .home-link {
        align-self: end;
        border: 1px solid var(--line);
        padding: 15px 18px;
        background: rgba(0, 0, 0, 0.24);
        color: var(--text);
        font: inherit;
        font-weight: 900;
        text-decoration: none;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.24s ease, border-color 0.24s ease, background 0.24s ease, box-shadow 0.24s ease, opacity 0.24s ease;
      }

      button,
      .cancel-link {
        border: 1px solid rgba(215, 180, 106, 0.42);
        background: rgba(215, 180, 106, 0.08);
        color: var(--gold);
      }

      button:hover,
      button:focus-visible,
      .cancel-link:hover,
      .cancel-link:focus-visible,
      .home-link:hover,
      .home-link:focus-visible {
        border-color: rgba(240, 210, 138, 0.72);
        background: rgba(215, 180, 106, 0.13);
        box-shadow: 0 18px 42px rgba(215, 180, 106, 0.12);
        outline: none;
        transform: translateY(-2px);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      [data-my-bookings-status] {
        min-height: 22px;
        color: var(--muted);
      }

      [data-my-bookings-status][data-type="error"] {
        color: var(--danger);
      }

      [data-my-bookings-status][data-type="success"] {
        color: var(--success);
      }

      .booking-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
        gap: 16px;
        margin-top: 22px;
      }

      .booking-card {
        display: grid;
        gap: 18px;
        min-height: 100%;
        padding: 22px;
        border: 1px solid var(--line);
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.035), rgba(215, 180, 106, 0.04)),
          rgba(0, 0, 0, 0.2);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.025),
          0 18px 42px rgba(0, 0, 0, 0.2);
        transition: transform 0.24s ease, border-color 0.24s ease, box-shadow 0.24s ease, background 0.24s ease;
      }

      .booking-card:hover {
        border-color: rgba(215, 180, 106, 0.48);
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.045), rgba(215, 180, 106, 0.075)),
          rgba(0, 0, 0, 0.22);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.035),
          0 24px 58px rgba(0, 0, 0, 0.28);
        transform: translateY(-3px);
      }

      .booking-card__eyebrow {
        display: inline-flex;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .booking-card__service {
        margin: 0;
        color: var(--text);
        font-family: Oswald, sans-serif;
        font-size: clamp(28px, 5vw, 38px);
        line-height: 0.95;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .booking-card__meta {
        display: grid;
        gap: 10px;
        margin: 0;
      }

      .booking-card__meta div {
        display: flex;
        justify-content: space-between;
        gap: 18px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(215, 180, 106, 0.12);
      }

      .booking-card__meta dt {
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
      }

      .booking-card__meta dd {
        margin: 0;
        color: var(--text);
        font-weight: 900;
        text-align: right;
      }

      .booking-card__footer {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-top: 2px;
      }

      .booking-card strong {
        display: block;
        margin-top: 4px;
      }

      .booking-card:focus-visible {
        border-color: rgba(240, 210, 138, 0.72);
        box-shadow: 0 0 0 4px var(--gold-soft), 0 18px 42px rgba(215, 180, 106, 0.12);
        outline: none;
      }

      .empty-state {
        display: grid;
        gap: 14px;
        align-items: start;
        padding: 22px;
        border: 1px solid var(--line);
        color: var(--muted);
        background: rgba(0, 0, 0, 0.18);
      }

      .status-badge {
        display: inline-flex;
        width: fit-content;
        border: 1px solid var(--line);
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .status-badge--confirmed {
        border-color: rgba(215, 180, 106, 0.44);
        color: var(--gold);
        background: var(--gold-soft);
      }

      .status-badge--completed {
        border-color: rgba(142, 224, 161, 0.42);
        color: var(--success);
        background: rgba(142, 224, 161, 0.1);
      }

      .status-badge--cancelled {
        border-color: rgba(255, 122, 122, 0.42);
        color: var(--danger);
        background: rgba(255, 122, 122, 0.1);
      }

      .status-badge--pending {
        border-color: rgba(183, 178, 168, 0.34);
        color: var(--neutral);
        background: rgba(183, 178, 168, 0.08);
      }

      .cancel-link[aria-disabled="true"] {
        pointer-events: none;
        opacity: 0.62;
      }

      .unavailable-action {
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .empty-state .home-link {
        width: fit-content;
      }

      .top-actions {
        margin-top: 18px;
      }

      @media (max-width: 760px) {
        form {
          grid-template-columns: 1fr;
        }

        .booking-card {
          padding: 18px;
        }

        .booking-card__footer,
        .booking-card__meta div {
          align-items: flex-start;
          flex-direction: column;
          gap: 6px;
        }

        .booking-card__meta dd {
          text-align: left;
        }

        button,
        .cancel-link,
        .home-link {
          width: 100%;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <main class="bookings-shell">
      <section class="panel">
        <a class="brand" href="index.html" aria-label="Invictus Barber">
          <span class="brand__mark">IB</span>
          <span>
            <strong>Invictus</strong>
            <small>Barber Studio</small>
          </span>
        </a>

        <h1>Meus agendamentos</h1>
        <p>Consulte, acompanhe ou cancele seus horários agendados.</p>

        <form data-my-bookings-form novalidate>
          <label>
            WhatsApp
            <input name="clientWhatsapp" type="tel" placeholder="(67) 98209-4572" autocomplete="tel" inputmode="tel" required />
          </label>
          <button type="submit" data-my-bookings-submit>Buscar</button>
        </form>

        <div data-my-bookings-status role="status" aria-live="polite"></div>
        <div class="booking-list" data-my-bookings-list></div>

        <div class="top-actions">
          <a class="home-link" href="index.html#agenda">Voltar para agenda</a>
        </div>
      </section>
    </main>

    <script type="module" src="assets/js/my-bookings.js"></script>
  </body>
</html>
